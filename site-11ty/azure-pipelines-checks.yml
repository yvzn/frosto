# Checks for every PR touching site-11ty/: self-tests, then a build of both sites
# (the build fails on a template error or an unobfuscated email address). Deploys nothing:
# deployment is azure-pipelines.yml.

trigger: none

pr:
  branches:
    include:
    - main
  paths:
    include:
    - site-11ty

pool:
  vmImage: ubuntu-latest

steps:
- task: UseNode@1
  inputs:
    version: '26'
  displayName: 'Install Node.js'

- task: Npm@1
  displayName: 'npm install'
  inputs:
    command: 'ci'
    workingDir: 'site-11ty'

- script: npm test
  displayName: 'self-tests'
  workingDirectory: 'site-11ty'

# Endpoints stay empty (env/<site>/.env): this build only checks that both sites build.
- script: npm run build
  displayName: 'build both sites'
  workingDirectory: 'site-11ty'
