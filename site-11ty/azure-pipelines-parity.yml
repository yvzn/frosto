# Parity safety net for the Eleventy migration (site-11ty/).
# Runs on every PR touching the new site or the legacy sites.
# Deploys nothing. The legacy site pipelines are untouched.

trigger:
  branches:
    include:
    - main
  paths:
    include:
    - site-11ty
    - site
    - site-en

pr:
  branches:
    include:
    - main
  paths:
    include:
    - site-11ty
    - site
    - site-en

pool:
  vmImage: ubuntu-latest

steps:
- task: UseNode@1
  inputs:
    version: '26'
  displayName: 'Install Node.js'

- task: Npm@1
  displayName: 'npm install'
  inputs:
    command: 'ci'
    workingDir: 'site-11ty'

- script: npm test
  displayName: 'parity check self-tests'
  workingDirectory: 'site-11ty'

# Rebuilds site/ and site-en/ and compares them with baseline/.
# Fails if a legacy page changed without the baseline being regenerated,
# which would make every later parity check compare against stale output.
- script: npm run baseline:verify
  displayName: 'baseline matches legacy sites'
  workingDirectory: 'site-11ty'

# From checkpoint 2 on, add here: build the new sites with the same dummy
# endpoints (scripts/lib/sites.mjs), then "npm run check".
